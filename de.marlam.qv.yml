app-id: de.marlam.qv
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: qv
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # OpenGL rendering
  - --device=dri
  # Read any scientific data file (mostly stored outside the xdg hierarchy,
  # but should still be in $HOME) and save a visualization alongside it
  - --filesystem=home
cleanup:
  - '/include'
  - '/lib/cfitsio*'
  - '/lib/cmake'
  - '/lib/pkgconfig'
  - '/lib/python*'
  - '/lib/*.a'
  - '/share/COPYING'
  - '/share/RELEASE.txt'
  - '/share/USING_HDF5_CMake.txt'
  - '/share/bash-completion'
  - '/share/cmake'
  - '/share/doc'
  - '/share/man'
modules:
  # Exiv2: used by libtgd to read png and jpeg metadata
  - name: exiv2
    buildsystem: cmake-ninja
    config-opts:
      - -DEXIV2_BUILD_EXIV2_COMMAND=OFF
      - -DEXIV2_ENABLE_INIH=OFF
    sources:
      - type: archive
        url: https://github.com/Exiv2/exiv2/archive/refs/tags/v0.28.8.tar.gz
        sha256: ea51b0609f58a9afa063b60daa1539948b62247721e154f4fff0ad3aec9f9756
    cleanup:
      - '/bin'
  # Dcmtk: used by libtgd to read DICOM medical image data
  - name: dcmtk
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_APPS=OFF
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: archive
        url: https://dicom.offis.de/download/dcmtk/dcmtk370/dcmtk-3.7.0.tar.gz
        sha256: f103df876040a4f904f01d2464f7868b4feb659d8cd3f46a5f1f61aa440be415
    cleanup:
      - '/bin'
  # libdeflate: prerequisite for OpenEXR
  - name: libdeflate
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/ebiggers/libdeflate/releases/download/v1.25/libdeflate-1.25.tar.gz
        sha256: fed5cd22f00f30cc4c2e5329f94e2b8a901df9fa45ee255cb70e2b0b42344477
    cleanup:
      - '/bin'
  # Imath: prerequisite for OpenEXR
  - name: Imath
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/AcademySoftwareFoundation/Imath/releases/download/v3.2.2/Imath-3.2.2.tar.gz
        sha256: 0f5a783b424f374e6f27ec8b0c73130e89b08814ac8fa2e84fd7fe0b05862c53
  # OpenEXR: used by libtgd to read EXR image data
  - name: OpenEXR
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/AcademySoftwareFoundation/openexr/releases/download/v3.3.12/openexr-3.3.12.tar.gz
        sha256: 1b1526b0e6f83db906b0793b59abc2c25f67bbe16755f5a936bdaf8780438f8d
    cleanup:
      - '/bin'
  # cfitsio: used by libtgd to read FITS astronomy data
  - name: cfitsio
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/heasarc/cfitsio/archive/refs/tags/cfitsio-4.6.4.tar.gz
        sha256: fb09b18638b0a71fa3c2612aac4fafd29cae8642266ba690803eb95f037a5268
    cleanup:
      - '/bin'
  # Boost: recommended (though not strictly required) by poppler for performance reasons.
  # Note that poppler uses only the container headers, but its CMakeLists.txt wants to
  # detect all of Boost, so we build it all here.
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app
      - ./b2 install
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.bz2
        sha256: de5e6b0e4913395c6bdfa90537febd9028ea4c0735d2cdb0cd9b45d5f51264f5
    cleanup:
      - '/lib/libboost*'
  # poppler: used by libtgd to read PDFs
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_GLIB=OFF
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_LIBOPENJPEG=none
      - -DENABLE_CMS=none
      - -DENABLE_LIBCURL=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.07.0.tar.xz
        sha256: 304832f48f8a47fdca90c6b6d1f684e68f37c10c9a0726f345f4ca9df4ca01e2
    cleanup:
      - '/bin'
  # pfstools: libpfs is used by libtgd to read PFS image data
  - name: pfstools
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://altushost-swe.dl.sourceforge.net/project/pfstools/pfstools/2.2.0/pfstools-2.2.0.tgz
        sha256: 9bf6844985663226c21998eeb43c261acb8e4b3891b9a91b729554406289d7ca
    cleanup:
      - '/bin'
  # hdf5: used by libtgd to read HDF5 data files
  - name: hdf5
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://support.hdfgroup.org/releases/hdf5/2.1.1/downloads/hdf5-2.1.1.tar.gz
        sha256: efff93b5a904d66e8f626d7da60b5eedc9faf544be27dbabbaa87967b8ad798b
        strip-components: 2
    cleanup:
      - '/bin'
  # matio: used by libtgd to read Matlab .mat files
  - name: matio
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/tbeu/matio/releases/download/v1.5.30/matio-1.5.30.tar.gz
        sha256: 8bd3b9477042ecc00dd71c04762fa58468e14cccc32fd8c6826c2da1e8bc3107
    cleanup:
      - '/bin'
  # ImageMagick: used by libtgd to read a few exotic file formats that don't have their own importer
  - name: ImageMagick
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.2-29.tar.gz
        sha256: b05924ad73c6932ba62c9b32f338f0619b90b767162c8b767f3566556187a284
    cleanup:
      - '/bin'
  # PROJ: prerequisite for GDAL
  - name: PROJ
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.osgeo.org/proj/proj-9.8.1.tar.gz
        sha256: af5b731c145c1d13c4e3b4eeb7d167e94e845e440f71e3496b4ed8dae0291960
    cleanup:
      - '/bin'
  # GDAL: used by libtgd to read all sorts of Remote Sensing image data
  - name: GDAL
    buildsystem: cmake-ninja
    config-opts:
      - -DACCEPT_MISSING_SQLITE3_RTREE:BOOL=ON
      - -DGDAL_USE_POPPLER=OFF
    sources:
      - type: archive
        url: https://github.com/OSGeo/gdal/releases/download/v3.13.2/gdal-3.13.2.tar.xz
        sha256: 0200b7878d837a7f475ff4070121d0e601f8ef801c2fd83a64294c544f609211
    cleanup:
      - '/bin'
  # tgd: used by qv to read images and data files in almost any format, and manage the data in memory
  - name: tgd
    buildsystem: cmake-ninja
    config-opts:
      - -DTGD_BUILD_TOOL=OFF
      - -DTGD_BUILD_TOOL_MANPAGE=OFF
      - -DTGD_BUILD_DOCUMENTATION=OFF
    sources:
      - type: archive
        url: https://marlam.de/tgd/releases/tgd-5.1.tar.gz
        sha256: 7266bdfce03855000a08df20cb98db4baf057f24bd68cdc59a8d8efef602db01
  # finally, qv.
  - name: qv
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://marlam.de/qv/releases/qv-6.1.tar.gz
        sha256: 2ae31cf0c905c69386e1a4b739b1b03e3c67e977a8a0a140ff1f934e1c70e54a
